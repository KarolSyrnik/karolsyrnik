<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minecraft Server-Bild aus Spielerköpfen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ece4; --panel:#ffffff; --ink:#22281f; --muted:#5f6b58;
  --line:#c9d0c0; --accent:#4f8a2b; --accent-ink:#ffffff; --err:#b3361f;
  --checker1:#dfe3d8; --checker2:#cfd5c6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1c1f1a; --panel:#272b24; --ink:#e7eadf; --muted:#9aa58f;
    --line:#3c4237; --accent:#6db33f; --accent-ink:#13180f; --err:#ff8a6e;
    --checker1:#2f342b; --checker2:#262a22;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 18px 48px}
h1{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 24px;max-width:60ch}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:18px}
label{display:block;font-weight:500;margin:14px 0 6px}
label:first-child{margin-top:0}
textarea,input[type=number],select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:4px;padding:8px 10px}
textarea{min-height:150px;resize:vertical;font-family:"Pixelify Sans",monospace}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-weight:400;margin:10px 0 0}
input[type=color]{width:100%;height:40px;border:2px solid var(--line);border-radius:4px;background:var(--bg);padding:2px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:700 18px "Pixelify Sans",monospace;cursor:pointer;border:none;border-radius:4px;padding:12px 16px;width:100%;margin-top:18px;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
button:active{box-shadow:inset 0 2px 0 rgba(0,0,0,.25);transform:translateY(1px)}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{margin-top:8px;font-size:16px;padding:9px 14px;background:var(--bg);color:var(--ink);border:2px solid var(--line);box-shadow:none}
#sets{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
#sets li{display:flex;gap:6px;align-items:stretch}
#sets button{margin:0;width:auto;font:500 15px Rubik,system-ui,sans-serif;padding:7px 10px;border-radius:4px;box-shadow:none;background:var(--bg);color:var(--ink);border:2px solid var(--line)}
#sets .load{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sets .load small{color:var(--muted);margin-left:6px}
#sets .del{color:var(--err)}
#serverMsg{font-size:14px;color:var(--muted);margin:6px 0 0;min-height:1.4em}
#serverMsg.bad{color:var(--err)}
.ipline{display:grid;gap:8px}
.ipline button{width:100%;margin:0}
#saveMsg{font-size:14px;color:var(--accent);margin:4px 0 0;min-height:1.4em}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.stage{display:flex;justify-content:center}
canvas{image-rendering:pixelated;display:block;width:100%;height:auto}
.icon-mode canvas{width:min(100%,384px);height:auto}
#status{margin:12px 0 0;font-size:14px;color:var(--muted);min-height:1.5em}
#status .bad{color:var(--err)}
</style>
</head>
<body>
<main>
  <h1>Server-Bild aus Spielerköpfen</h1>
  <p class="lead">Spielernamen eintragen, Layout anpassen und das 64×64 Server-Icon als PNG speichern.</p>

  <div class="grid">
    <section class="panel" aria-label="Einstellungen">
      <label for="serverIp">Server-IP</label>
      <div class="ipline">
        <input id="serverIp" type="text" placeholder="z.B. play.meinserver.de" spellcheck="false" autocomplete="off">
        <button id="fetchPlayers" class="secondary" type="button">Online-Spieler abrufen</button>
      </div>
      <p id="serverMsg" role="status"></p>

      <label for="names">Spielernamen (einer pro Zeile oder mit Komma)</label>
      <textarea id="names" spellcheck="false">Notch
jeb_
Dinnerbone
Grumm</textarea>
      <div class="row">
        <button id="saveNames" class="secondary" type="button">Namen speichern</button>
        <button id="resetNames" class="secondary" type="button">Löschen</button>
      </div>
      <p id="saveMsg" role="status"></p>
      <label id="setsLabel" hidden>Gespeicherte Listen</label>
      <ul id="sets"></ul>

      <input type="hidden" id="mode" value="icon">

      <label for="cols">Ausrichtung</label>
      <select id="cols">
        <option value="grid">Raster (z.B. 2×2)</option>
        <option value="row">Nebeneinander</option>
        <option value="col">Untereinander</option>
      </select>
      <input type="hidden" id="size" value="64">
      <div class="row">
        <div>
          <label for="gap">Abstand (px)</label>
          <input id="gap" type="number" min="0" max="8" value="0">
        </div>
        <div>
          <label for="pad">Rand (px)</label>
          <input id="pad" type="number" min="0" max="8" value="0">
        </div>
      </div>

      <label for="bg">Hintergrundfarbe</label>
      <input id="bg" type="color" value="#3b5d29">
      <input type="hidden" id="square">
      <label class="check"><input id="transparent" type="checkbox"> Transparenter Hintergrund</label>
      <label class="check"><input id="helm" type="checkbox" checked> Hut-/Helm-Ebene anzeigen</label>
      <input type="hidden" id="labels">
      <label class="check"><input id="center" type="checkbox" checked> Letzte Reihe zentrieren</label>

      <button id="download">PNG herunterladen</button>
      <p class="hint">Server-Icon: Datei als <b>server-icon.png</b> in den Server-Ordner legen und Server neu starten.</p>
    </section>

    <section class="panel" aria-label="Vorschau">
      <div class="stage" id="stage"><canvas id="out" width="64" height="64"></canvas></div>
      <p id="status" role="status"></p>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const canvas = $('out'), ctx = canvas.getContext('2d');
const cache = new Map(); // key: name|helm -> Promise<Image|null>

function parseNames(){
  return $('names').value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean)
    .filter((n,i,a)=>a.findIndex(x=>x.toLowerCase()===n.toLowerCase())===i);
}

function loadImg(url){
  return new Promise(res=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>res(img);
    img.onerror = ()=>res(null);
    img.src = url;
  });
}

function getHead(name, helm){
  const key = name.toLowerCase()+'|'+helm;
  if(!cache.has(key)){
    const n = encodeURIComponent(name);
    const urls = helm
      ? [`https://mc-heads.net/avatar/${n}/8`, `https://minotar.net/helm/${n}/8.png`, `https://crafthead.net/helm/${n}/8`]
      : [`https://mc-heads.net/avatar/${n}/8/nohelm`, `https://minotar.net/avatar/${n}/8.png`, `https://crafthead.net/avatar/${n}/8`];
    cache.set(key, (async()=>{
      for(const u of urls){ const img = await loadImg(u); if(img) return img; }
      cache.delete(key); // beim nächsten Rendern erneut versuchen
      return null;
    })());
  }
  return cache.get(key);
}

function num(id, min, max){
  const v = parseInt($(id).value,10);
  return Math.min(max, Math.max(min, isNaN(v)?min:v));
}

let renderToken = 0;
async function render(){
  const token = ++renderToken;
  const empty = !parseNames().length;
  const names = empty ? ['?'] : parseNames();
  const helm = $('helm').checked;
  const status = $('status');
  status.textContent = 'Lade Köpfe …';
  const heads = empty ? [null] : await Promise.all(names.map(n=>getHead(n,helm)));
  if(token !== renderToken) return;

  const icon = $('mode').value === 'icon';
  document.body.classList.toggle('icon-mode', icon);
  const n = names.length;
  const layout = $('cols').value;
  let cols = layout === 'row' ? n : layout === 'col' ? 1 : Math.ceil(Math.sqrt(n));
  cols = Math.min(cols, n);
  const rows = Math.ceil(n/cols);
  let gap = num('gap',0,100), pad = num('pad',0,200), size = num('size',8,512);
  const labels = $('labels').checked && !icon;
  const fontSize = Math.max(10, Math.round(size*0.16));
  const labelH = labels ? Math.round(fontSize*1.6) : 0;
  let W, H, offX = 0, offY = 0;

  if(icon){
    W = H = 64;
    const span = Math.max(cols, rows);
    pad = Math.min(pad, 8); gap = Math.min(gap, 8);
    size = (64 - 2*pad - (span-1)*gap) / span; // exakt, kein Abrunden -> keine Lücke am Rand
    if(size < 2){ pad = 0; gap = 0; size = 64/span; }
    const gw = cols*size + (cols-1)*gap, gh = rows*size + (rows-1)*gap;
    offX = (64-gw)/2 - pad; offY = (64-gh)/2 - pad;
  } else {
    W = pad*2 + cols*size + (cols-1)*gap;
    H = pad*2 + rows*(size+labelH) + (rows-1)*gap;
    if($('square').checked){
      const S = Math.max(W,H);
      offX = Math.floor((S-W)/2); offY = Math.floor((S-H)/2);
      W = H = S;
    }
  }

  canvas.width = W; canvas.height = H;
  ctx.clearRect(0,0,W,H);
  if(!$('transparent').checked){ ctx.fillStyle = $('bg').value; ctx.fillRect(0,0,W,H); }
  ctx.imageSmoothingEnabled = false;
  ctx.font = `500 ${fontSize}px "Pixelify Sans", monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const missing = [];
  names.forEach((name,i)=>{
    const r = Math.floor(i/cols), c = i%cols;
    let rowShift = 0;
    if($('center').checked && r === rows-1){
      const inRow = n - r*cols;
      rowShift = (cols-inRow)*(size+gap)/2;
    }
    const fx = offX + pad + c*(size+gap) + rowShift;
    const fy = offY + pad + r*(size+labelH+gap);
    const x = Math.round(fx), y = Math.round(fy);
    const w = Math.round(fx+size) - x, h = Math.round(fy+size) - y;
    const img = heads[i];
    if(img){ ctx.drawImage(img, x, y, w, h); }
    else {
      missing.push(name);
      drawUnknown(x, y, w);
    }
    if(labels){
      ctx.fillStyle = $('transparent').checked ? '#fff' : textColorFor($('bg').value);
      ctx.fillText(name, x+size/2, y+size+labelH/2, size+gap);
    }
  });

  $('download').disabled = false;
  status.innerHTML = `${n} Kopf/Köpfe · ${W}×${H} px` +
    (empty ? '<br>Noch keine Namen eingetragen.' : missing.length ? `<br><span class="bad">Nicht gefunden: ${missing.map(esc).join(', ')} – Schreibweise prüfen.</span>` : '');
}

// Pixel-Fragezeichen (16×16-Raster) auf grünem Feld
const QMARK = [
  '................',
  '................',
  '.....######.....',
  '....########....',
  '...###....###...',
  '...###....###...',
  '..........###...',
  '.........###....',
  '........###.....',
  '.......###......',
  '.......###......',
  '................',
  '.......###......',
  '.......###......',
  '................',
  '................'];
function shade(hex, f){
  const v = parseInt(hex.slice(1),16);
  const c = [v>>16, (v>>8)&255, v&255].map(x=>Math.round(x*f));
  return `rgb(${c.join(',')})`;
}
function drawUnknown(x, y, size){
  const green = $('transparent').checked ? '#3b5d29' : $('bg').value;
  ctx.fillStyle = shade(green, 0.8); ctx.fillRect(x, y, size, size);
  const p = size/16;
  const px = (c,r,col)=>{ ctx.fillStyle = col;
    ctx.fillRect(Math.round(x+c*p), Math.round(y+r*p), Math.max(1,Math.round(x+(c+1)*p)-Math.round(x+c*p)), Math.max(1,Math.round(y+(r+1)*p)-Math.round(y+r*p))); };
  QMARK.forEach((row,r)=>[...row].forEach((ch,c)=>{ if(ch==='#') px(c+1, r+1, 'rgba(0,0,0,.35)'); }));
  QMARK.forEach((row,r)=>[...row].forEach((ch,c)=>{ if(ch==='#') px(c, r, '#ffffff'); }));
}

function textColorFor(hex){
  const v = parseInt(hex.slice(1),16), r=v>>16, g=(v>>8)&255, b=v&255;
  return (r*299+g*587+b*114)/1000 > 140 ? '#1a1a1a' : '#ffffff';
}
function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let t;
function schedule(delay){ clearTimeout(t); t = setTimeout(render, delay); }
$('names').addEventListener('input', ()=>schedule(600));
['mode','cols','size','gap','pad','bg','square','transparent','helm','labels','center'].forEach(id=>{
  $(id).addEventListener('input', ()=>schedule(80));
  $(id).addEventListener('change', ()=>schedule(0));
});

$('download').addEventListener('click', ()=>{
  try{
    const a = document.createElement('a');
    a.download = $('mode').value === 'icon' ? 'server-icon.png' : 'minecraft-koepfe.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }catch(e){
    $('status').innerHTML = '<span class="bad">Export blockiert (CORS). Seite über einen Webserver öffnen, z.B. GitHub Pages.</span>';
  }
});

// Gespeicherte Namenslisten
const SETS_KEY = 'mc-koepfe-listen';
function loadSets(){
  try{
    const sets = JSON.parse(localStorage.getItem(SETS_KEY) || '[]');
    const old = localStorage.getItem('mc-koepfe-namen'); // alte Einzel-Speicherung übernehmen
    if(old){ sets.push({id:Date.now(), title:'Gespeichert', names:old}); localStorage.removeItem('mc-koepfe-namen'); saveSets(sets); }
    return sets;
  }catch(e){ return []; }
}
function saveSets(sets){
  try{ localStorage.setItem(SETS_KEY, JSON.stringify(sets)); return true; }
  catch(e){ flash('Speichern nicht möglich (Browser blockiert lokalen Speicher).'); return false; }
}
function flash(msg){
  $('saveMsg').textContent = msg;
  clearTimeout(window._msgT);
  window._msgT = setTimeout(()=>$('saveMsg').textContent='', 2500);
}
function countNames(txt){ return txt.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean).length; }

function showSets(){
  const sets = loadSets(), ul = $('sets');
  ul.innerHTML = '';
  $('setsLabel').hidden = !sets.length;
  sets.forEach(set=>{
    const li = document.createElement('li');
    const load = document.createElement('button');
    load.className = 'load'; load.type = 'button'; load.title = 'Laden';
    load.textContent = set.title;
    const small = document.createElement('small'); small.textContent = `(${countNames(set.names)})`;
    load.appendChild(small);
    load.onclick = ()=>{ $('names').value = set.names; render(); flash(`„${set.title}“ geladen.`); };

    const ren = document.createElement('button');
    ren.type = 'button'; ren.textContent = 'Umbenennen';
    ren.onclick = ()=>{
      const t = prompt('Neuer Name für die Liste:', set.title);
      if(t === null || !t.trim()) return;
      const all = loadSets(); const s2 = all.find(x=>x.id===set.id);
      if(s2){ s2.title = t.trim(); if(saveSets(all)){ showSets(); flash('Umbenannt.'); } }
    };

    const del = document.createElement('button');
    del.type = 'button'; del.className = 'del'; del.textContent = '✕'; del.title = 'Löschen';
    del.setAttribute('aria-label', `„${set.title}“ löschen`);
    del.onclick = ()=>{
      if(!confirm(`„${set.title}“ löschen?`)) return;
      if(saveSets(loadSets().filter(x=>x.id!==set.id))){ showSets(); flash('Liste gelöscht.'); }
    };
    li.append(load, ren, del);
    ul.appendChild(li);
  });
}

$('saveNames').addEventListener('click', ()=>{
  const names = $('names').value.trim();
  if(!names){ flash('Erst Namen eintragen.'); return; }
  const sets = loadSets();
  const t = prompt('Name für die Liste:', `Liste ${sets.length+1}`);
  if(t === null) return;
  sets.push({id:Date.now(), title:(t.trim() || `Liste ${sets.length+1}`), names});
  if(saveSets(sets)){ showSets(); flash('Namen gespeichert.'); }
});

$('resetNames').addEventListener('click', ()=>{
  $('names').value = '';
  render();
  flash('Namensfeld geleert.');
});

showSets();
// Online-Spieler vom Server abrufen
const IP_KEY = 'mc-koepfe-ip';
try{ $('serverIp').value = localStorage.getItem(IP_KEY) || ''; }catch(e){}

function serverMsg(text, bad){ const el = $('serverMsg'); el.textContent = text; el.classList.toggle('bad', !!bad); }

async function fetchStatus(ip){
  // 1. mcsrvstat.us
  try{
    const r = await fetch(`https://api.mcsrvstat.us/3/${encodeURIComponent(ip)}`);
    if(r.ok){
      const d = await r.json();
      return { online: !!d.online, count: d.players?.online ?? 0, max: d.players?.max ?? 0,
               names: (d.players?.list || []).map(p=>p.name).filter(Boolean) };
    }
  }catch(e){}
  // 2. mcstatus.io als Ausweich
  const r = await fetch(`https://api.mcstatus.io/v2/status/java/${encodeURIComponent(ip)}`);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d = await r.json();
  return { online: !!d.online, count: d.players?.online ?? 0, max: d.players?.max ?? 0,
           names: (d.players?.list || []).map(p=>p.name_clean || p.name_raw).filter(Boolean) };
}

$('fetchPlayers').addEventListener('click', async ()=>{
  const ip = $('serverIp').value.trim();
  if(!ip){ serverMsg('Erst eine Server-IP eintragen.', true); return; }
  try{ localStorage.setItem(IP_KEY, ip); }catch(e){}
  const btn = $('fetchPlayers'); btn.disabled = true;
  serverMsg('Frage Server ab …');
  try{
    const st = await fetchStatus(ip);
    if(!st.online){ serverMsg('Server ist offline oder nicht erreichbar.', true); return; }
    if(st.count === 0){ serverMsg(`Server online, aber gerade 0/${st.max} Spieler.`); return; }
    if(!st.names.length){
      serverMsg(`${st.count}/${st.max} online, aber der Server zeigt keine Spielernamen an.`, true); return;
    }
    $('names').value = st.names.join('\n');
    render();
    // Live-Spieler als eigene Liste speichern (wird bei jedem Abruf aktualisiert)
    const sets = loadSets(), liveId = 'live:' + ip.toLowerCase();
    let live = sets.find(x=>x.id===liveId);
    if(!live){ live = {id:liveId, title:`Live – ${ip}`}; sets.unshift(live); }
    live.names = st.names.join('\n');
    if(saveSets(sets)) showSets();
    const more = st.count > st.names.length ? ` (Server zeigt nur ${st.names.length} davon)` : '';
    serverMsg(`${st.count}/${st.max} Spieler online${more}.`);
  }catch(e){
    serverMsg('Abruf fehlgeschlagen. IP prüfen oder später erneut versuchen.', true);
  }finally{ btn.disabled = false; }
});
$('serverIp').addEventListener('keydown', e=>{ if(e.key==='Enter') $('fetchPlayers').click(); });

document.fonts.ready.then(render);
</script>
</body>
</html>
